<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>مساعد الروبوت الصوتي</title>
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <style>
    :root{
      --bg:#0b1020; --panel:#141d31; --panel2:#1b2740; --line:#2e3b55;
      --text:#eef3ff; --muted:#a6b3cc; --green:#57d9a3; --greenDark:#168553;
      --blue:#60a5fa; --red:#f87171; --amber:#ffb86b;
      color-scheme:dark;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{
      margin:0;background:radial-gradient(900px 500px at 80% -10%,#1d3358 0%,var(--bg) 55%);
      color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
      overflow:hidden;
    }
    /* Full-height app shell: fixed top bar, flexible middle, fixed controls — no page scroll. */
    .app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:10px 14px 16px}

    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
    .iconbtn{width:42px;height:42px;border-radius:11px;border:0.5px solid var(--line);background:var(--panel);
      color:var(--text);font-size:21px;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .brand{font-size:15px;font-weight:600;letter-spacing:.02em}
    .conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
    .dot{width:9px;height:9px;border-radius:50%;background:#64748b}
    .dot.on{background:var(--green);box-shadow:0 0 10px #57d9a366}

    /* Robot head area */
    .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0}
    .head{width:min(42vw,170px);height:min(42vw,170px);border-radius:50%;background:var(--panel);
      border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:border-color .2s}
    .head i{font-size:min(20vw,80px);color:var(--muted);transition:color .2s}
    .head.speaking{border-color:var(--green);animation:headPulse 1s ease-in-out infinite}
    .head.speaking i{color:var(--green)}
    .head.listening{border-color:var(--red)}
    .head.listening i{color:var(--red)}
    @keyframes headPulse{0%,100%{box-shadow:0 0 0 0 #57d9a300}50%{box-shadow:0 0 0 10px #57d9a31a}}
    .mouth{height:18px;display:flex;align-items:flex-end;gap:4px}
    .mouth span{width:4px;height:5px;background:var(--green);border-radius:2px;opacity:.35}
    .mouth.active span{animation:bar .6s ease-in-out infinite}
    .mouth.active span:nth-child(2){animation-delay:.12s}
    .mouth.active span:nth-child(3){animation-delay:.24s}
    .mouth.active span:nth-child(4){animation-delay:.08s}
    .mouth.active span:nth-child(5){animation-delay:.2s}
    @keyframes bar{0%,100%{height:5px;opacity:.4}50%{height:17px;opacity:1}}
    .stageMsg{font-size:12px;color:var(--muted);text-align:center;min-height:16px;padding:0 10px;
      max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Controls */
    .mic{width:100%;min-height:60px;border:0;border-radius:15px;background:var(--greenDark);color:var(--text);
      font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;margin:8px 0 10px}
    .mic:active{transform:scale(.99)}
    .mic.listening{background:#922f45;animation:headPulse 1.3s infinite}
    .mic:disabled{opacity:.55}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .grid button{border:0;border-radius:12px;background:var(--panel2);color:var(--text);
      font-size:12.5px;font-weight:500;padding:12px 4px;cursor:pointer}
    .grid button:active{transform:scale(.98)}
    .grid button.stop{background:#3a2330;color:var(--amber)}

    /* Offcanvas */
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.25s;z-index:20}
    .scrim.open{opacity:1;visibility:visible}
    .drawer{position:fixed;top:0;right:0;height:100dvh;width:min(86vw,360px);background:var(--bg);
      border-left:0.5px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:21;
      display:flex;flex-direction:column}
    .drawer.open{transform:translateX(0)}
    .drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid var(--line)}
    .drawer .body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:18px}
    .sec h3{font-size:13px;color:var(--green);margin:0 0 9px;font-weight:600}
    label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}
    input,select{width:100%;border-radius:10px;border:0.5px solid var(--line);background:#0c1425;color:var(--text);padding:11px;font:inherit}
    .drawer .btn{width:100%;border:0.5px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);
      padding:11px;font-weight:500;cursor:pointer;margin-top:8px}
    .drawer .btn.primary{background:var(--greenDark);border-color:#2c9d84}
    .row{display:flex;gap:8px}.row>*{flex:1}
    .status{padding:9px 11px;background:#0c1425;border:0.5px solid var(--line);border-radius:10px;margin-top:9px;color:var(--muted);font-size:12px;line-height:1.6;overflow-wrap:anywhere}
    .status.good{color:var(--green);border-color:#226947}.status.bad{color:#fecaca;border-color:#7f3341}
    .toggle{display:flex;align-items:center;gap:9px;margin-top:10px;color:var(--text);font-size:13px}
    .toggle input{width:18px;height:18px;flex:0 0 auto}
    .poseList{display:flex;flex-direction:column;gap:7px}
    .pose{display:flex;align-items:center;gap:7px;background:var(--panel);border-radius:10px;padding:9px 11px}
    .pose .nm{flex:1;font-size:13px}
    .pose .ang{font-size:11px;color:var(--muted)}
    .pose .play,.pose .del{width:34px;height:34px;border-radius:9px;border:0;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
    .pose .play{background:var(--greenDark);color:var(--text)}
    .pose .del{background:#3a2330;color:var(--red)}
    .empty{font-size:12px;color:var(--muted);text-align:center;padding:8px}
    .three{display:flex;gap:7px}.three>div{flex:1}
    .hint{font-size:11px;color:var(--muted);line-height:1.6;margin:6px 0 0}
  </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div style="display:flex;gap:8px;align-items:center">
            <button class="iconbtn" id="menuBtn" aria-label="القائمة"><i class="hgi-stroke hgi-menu-01"></i></button>
            <a class="iconbtn" href="vision.html" aria-label="الرؤية" style="width:auto;padding:0 12px;font-size:13px;font-weight:600;text-decoration:none">الرؤية</a>
        </div>
        <span class="brand">Bidex</span>
        <span class="conn"><span class="dot" id="serialDot"></span><span id="serialLabel">غير متصل</span></span>
    </div>

  <div class="stage">
    <div class="head" id="head"><i class="hgi-stroke hgi-bot-message-square"></i></div>
    <div class="mouth" id="mouth"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="stageMsg" id="stageMsg">جاهز</div>
  </div>

  <button class="mic" id="micBtn"><i class="hgi-stroke hgi-mic-01" style="font-size:22px"></i><span id="micLabel">اضغط وتحدث</span></button>

  <div class="grid">
    <button data-action="wrist_test">المعصم</button>
    <button data-action="elbow_test">الكوع</button>
    <button data-action="gripper_open">افتح اليد</button>
    <button data-action="gripper_close">اقفل اليد</button>
    <button data-action="home">البداية</button>
    <button data-action="random_start">عشوائي</button>
  </div>
  <div class="grid" style="margin-top:7px">
    <button class="stop" data-action="random_stop" style="grid-column:1 / -1">إيقاف العشوائي</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <header>
    <span style="font-weight:600;font-size:15px">الإعدادات والتحكم</span>
    <button class="iconbtn" id="closeBtn" aria-label="إغلاق"><i class="hgi-stroke hgi-cancel-01"></i></button>
  </header>
  <div class="body">

    <div class="sec">
      <h3>الاتصال</h3>
      <label for="accessKey">مفتاح التحكم</label>
      <input id="accessKey" type="password" autocomplete="off" placeholder="من appsettings.json" value="">
      <label for="portSelect">منفذ USB</label>
      <div class="row">
        <select id="portSelect"><option value="">اضغط تحديث</option></select>
        <button class="btn" id="refreshPorts" style="flex:0 0 90px;margin:0">تحديث</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" id="connectBtn" style="margin:0">اتصال</button>
        <button class="btn" id="disconnectBtn" style="margin:0">فصل</button>
      </div>
      <div class="status" id="serialStatus">أغلق Serial Monitor قبل الاتصال.</div>
      <div class="status" id="deviceMessage">رسالة الجهاز: —</div>
    </div>

    <div class="sec">
      <h3>الوضعيات المحفوظة</h3>
      <div class="poseList" id="poseList"><div class="empty">لا توجد وضعيات بعد.</div></div>
      <label>احفظ وضعية جديدة (الزوايا يدويًا)</label>
      <div class="three">
        <div><input id="poseW" type="number" inputmode="numeric" placeholder="معصم"></div>
        <div><input id="poseE" type="number" inputmode="numeric" placeholder="كوع"></div>
        <div><input id="poseG" type="number" inputmode="numeric" placeholder="يد"></div>
      </div>
      <input id="poseName" type="text" placeholder="اسم الوضعية" style="margin-top:7px">
      <button class="btn primary" id="savePose">حفظ الوضعية</button>
      <p class="hint">المعصم/الكوع 10–170 · اليد 100–170</p>
      <div class="status" id="poseStatus" style="display:none"></div>
    </div>

    <div class="sec">
      <h3>الإعدادات</h3>
      <label for="speechLang">لغة التعرف على الكلام</label>
      <select id="speechLang">
        <option value="ar-SA" selected>العربية — السعودية</option>
        <option value="ar-EG">العربية — مصر</option>
        <option value="en-US">English — US</option>
      </select>
      <label for="manualText">أو اكتب الأمر للاختبار</label>
      <div class="row">
        <input id="manualText" type="text" placeholder="مثال: حرّك الكوع إلى 120">
        <button class="btn" id="interpretBtn" style="flex:0 0 80px;margin:0">فهم</button>
      </div>
      <div class="toggle">
        <input type="checkbox" id="autoExecute">
        <label for="autoExecute" style="margin:0;color:var(--text)">تنفيذ تلقائي بعد الفهم</label>
      </div>
      <div class="status" id="actionStatus" style="margin-top:10px">بانتظار أمر.</div>
    </div>

  </div>
</aside>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let pendingId = null, pendingIntent = null, recognition = null, listening = false;

  let soundMap = {};
  async function loadSoundMap(){
    try{ const r = await fetch('sounds/manifest.json',{cache:'no-store'}); if(r.ok) soundMap = await r.json(); }catch{}
  }
  // Animate the head/mouth for the length of the audio clip, then stop.
  function speakFace(audio){
    const head = $('head'), mouth = $('mouth');
    head.classList.add('speaking'); mouth.classList.add('active');
    const stop = () => { head.classList.remove('speaking'); mouth.classList.remove('active'); };
    audio.addEventListener('ended', stop, {once:true});
    audio.addEventListener('error', stop, {once:true});
  }
  function playSound(key){
    const src = key && soundMap[key];
    if(!src) return;
    try{
      const audio = new Audio(src);
      speakFace(audio);
      audio.play().catch(()=>{ $('head').classList.remove('speaking'); $('mouth').classList.remove('active'); });
    }catch{}
  }

  function setStatus(id,text,kind=''){ const n=$(id); if(!n) return; n.textContent=text; n.className='status'+(kind?' '+kind:''); }
  function setStage(text){ $('stageMsg').textContent = text; }

  async function api(path, method='GET', body=undefined){
    const headers = { 'X-Robot-Key': $('accessKey').value.trim() };
    if(body!==undefined) headers['Content-Type']='application/json';
    const r = await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
    let data={}; try{ data=await r.json(); }catch{}
    if(!r.ok){ throw new Error(data.messageAr||data.detail||data.title||('HTTP '+r.status)); }
    return data;
  }

  // ---- Offcanvas ----
  function openDrawer(){ $('drawer').classList.add('open'); $('scrim').classList.add('open'); }
  function closeDrawer(){ $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); }

  // ---- Direct commands (buttons, no Ollama) ----
  async function directCommand(action){
    setStage('إرسال الأمر…');
    setStatus('actionStatus','يرسل الأمر المباشر…');
    try{
      const data = await api('/api/command','POST',{action});
      setStatus('actionStatus',data.messageAr||'تم.', 'good');
      setStage(data.messageAr||'تم');
      playSound(action);
      await refreshStatus();
    }catch(e){ setStatus('actionStatus',e.message,'bad'); setStage('خطأ'); }
  }

  // ---- Voice / interpret ----
  async function interpret(text){
    const transcript=String(text||'').trim(); if(!transcript) return;
    $('manualText').value=transcript;
    $('interpretBtn').disabled=true; $('micBtn').disabled=true;
    pendingId=null;
    setStatus('actionStatus','يرسل النص إلى Ollama لفهم الأمر…'); setStage('أفكّر…');
    try{
      const data = await api('/api/interpret','POST',{transcript});
      pendingId=data.pendingId||null; pendingIntent=data.intent||null;
      if(!pendingId){ setStatus('actionStatus',data.messageAr||'لم يُفهم.', 'bad'); setStage(data.messageAr||'لم أفهم'); }
      else{ setStatus('actionStatus',data.messageAr||'تم الفهم.', 'good'); setStage(data.messageAr||'فهمت');
        if($('autoExecute').checked) await executePending(); }
    }catch(e){ setStatus('actionStatus',e.message,'bad'); setStage('خطأ'); }
    finally{ $('interpretBtn').disabled=false; $('micBtn').disabled=false; }
  }
  async function executePending(){
    if(!pendingId) return; const id=pendingId, intent=pendingIntent; pendingId=null;
    setStatus('actionStatus','يرسل الأمر للروبوت…');
    try{
      const data = await api('/api/execute','POST',{pendingId:id});
      setStatus('actionStatus',data.messageAr||'تم الإرسال.', 'good'); setStage(data.messageAr||'تم');
      playSound(intent); await refreshStatus();
    }catch(e){ setStatus('actionStatus',e.message,'bad'); setStage('خطأ'); }
  }

  // ---- Poses ----
  async function loadPoses(){
    try{
      const poses = await api('/api/poses');
      const box = $('poseList'); box.innerHTML='';
      if(!poses.length){ box.innerHTML='<div class="empty">لا توجد وضعيات بعد.</div>'; return; }
      poses.forEach(p=>{
        const el=document.createElement('div'); el.className='pose';
        el.innerHTML='<span class="nm">'+escapeHtml(p.name)+
          '<div class="ang">معصم '+p.wrist+' · كوع '+p.elbow+' · يد '+p.gripper+'</div></span>'+
          '<button class="play" title="تشغيل"><i class="hgi-stroke hgi-play"></i></button>'+
          '<button class="del" title="حذف"><i class="hgi-stroke hgi-delete-02"></i></button>';
        el.querySelector('.play').addEventListener('click',()=>playPose(p.id));
        el.querySelector('.del').addEventListener('click',()=>deletePose(p.id));
        box.appendChild(el);
      });
    }catch(e){ /* key may be empty before first entry */ }
  }
  async function playPose(id){
    try{ const d=await api('/api/poses/'+id+'/play','POST',{}); setStatus('actionStatus',d.messageAr,'good'); setStage(d.messageAr); await refreshStatus(); }
    catch(e){ setStatus('actionStatus',e.message,'bad'); }
  }
  async function deletePose(id){
    try{ await api('/api/poses/'+id,'DELETE'); await loadPoses(); }
    catch(e){ showPoseStatus(e.message,'bad'); }
  }
  function showPoseStatus(text,kind){ const n=$('poseStatus'); n.style.display='block'; n.textContent=text; n.className='status '+kind; }
  async function savePose(){
    const name=$('poseName').value.trim();
    const w=Number($('poseW').value), e=Number($('poseE').value), g=Number($('poseG').value);
    if(!name){ showPoseStatus('أدخل اسمًا للوضعية.','bad'); return; }
    if(![w,e,g].every(Number.isInteger)){ showPoseStatus('أدخل الزوايا الثلاث كأرقام.','bad'); return; }
    try{
      const d=await api('/api/poses','POST',{name,wrist:w,elbow:e,gripper:g});
      showPoseStatus(d.messageAr,'good');
      $('poseName').value=''; $('poseW').value=''; $('poseE').value=''; $('poseG').value='';
      await loadPoses();
    }catch(err){ showPoseStatus(err.message,'bad'); }
  }

  function escapeHtml(v){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---- Serial status / ports ----
  async function refreshPorts(){
    try{
      const data = await api('/api/ports');
      const sel=$('portSelect'); const prev=sel.value; sel.innerHTML='';
      if(!data.ports.length){ sel.add(new Option('لا توجد منافذ','')); }
      else{ sel.add(new Option('اختر المنفذ…','')); data.ports.forEach(p=>sel.add(new Option(p,p))); if(data.ports.includes(prev)) sel.value=prev; }
      setStatus('serialStatus','تم فحص المنافذ.'); renderSerial(data.serial);
    }catch(e){ setStatus('serialStatus',e.message,'bad'); }
  }
  function renderSerial(s){
    const c=!!(s&&s.connected);
    $('serialDot').classList.toggle('on',c);
    $('serialLabel').textContent = c ? ('متصل: '+s.portName) : 'غير متصل';
    if(s&&s.portName) $('portSelect').value=s.portName;
    if(s&&s.lastDeviceMessage) $('deviceMessage').textContent='رسالة الجهاز: '+s.lastDeviceMessage;
  }
  async function refreshStatus(){ try{ renderSerial(await api('/api/status')); }catch{} }

  // ---- Speech recognition ----
  function startRecognition(){
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ setStage('المتصفح لا يدعم التعرف على الكلام'); return; }
    if(listening && recognition){ recognition.stop(); return; }
    recognition=new SR(); recognition.lang=$('speechLang').value;
    recognition.continuous=false; recognition.interimResults=true; recognition.maxAlternatives=1;
    let finalText='';
    recognition.onstart=()=>{ listening=true; $('micBtn').classList.add('listening'); $('head').classList.add('listening'); $('micLabel').textContent='أستمع… اضغط للإيقاف'; setStage('أستمع إليك…'); };
    recognition.onresult=ev=>{ let interim=''; for(let i=ev.resultIndex;i<ev.results.length;i++){ const t=ev.results[i][0].transcript; if(ev.results[i].isFinal) finalText+=t; else interim+=t; }
      if(interim) setStage('أسمع: '+interim);
      if(finalText.trim()){ recognition.stop(); interpret(finalText.trim()); finalText=''; } };
    recognition.onerror=ev=>{ let m='تعذر التعرف: '+ev.error; if(ev.error==='network') m+=' (تحقق من الإنترنت)'; if(ev.error==='not-allowed') m+=' (اسمح بالميكروفون)'; setStage(m); };
    recognition.onend=()=>{ listening=false; $('micBtn').classList.remove('listening'); $('head').classList.remove('listening'); $('micLabel').textContent='اضغط وتحدث'; };
    try{ recognition.start(); }catch(e){ setStage('تعذر بدء الميكروفون'); }
  }

  // ---- Wire up ----
  $('menuBtn').addEventListener('click',()=>{ openDrawer(); refreshPorts(); loadPoses(); });
  $('closeBtn').addEventListener('click',closeDrawer);
  $('scrim').addEventListener('click',closeDrawer);
  $('refreshPorts').addEventListener('click',refreshPorts);
  $('connectBtn').addEventListener('click',async()=>{ try{ const d=await api('/api/connect','POST',{portName:$('portSelect').value}); setStatus('serialStatus',d.messageAr,'good'); await refreshStatus(); }catch(e){ setStatus('serialStatus',e.message,'bad'); } });
  $('disconnectBtn').addEventListener('click',async()=>{ try{ const d=await api('/api/disconnect','POST',{}); setStatus('serialStatus',d.messageAr,'good'); await refreshStatus(); }catch(e){ setStatus('serialStatus',e.message,'bad'); } });
  $('micBtn').addEventListener('click',startRecognition);
  $('interpretBtn').addEventListener('click',()=>interpret($('manualText').value));
  $('manualText').addEventListener('keydown',ev=>{ if(ev.key==='Enter') interpret($('manualText').value); });
  $('savePose').addEventListener('click',savePose);
  document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>directCommand(b.dataset.action)));
  $('accessKey').addEventListener('change',()=>{ refreshPorts(); loadPoses(); });

  loadSoundMap();
  refreshPorts();
  setInterval(refreshStatus,2500);
})();
</script>
</body>
</html>
